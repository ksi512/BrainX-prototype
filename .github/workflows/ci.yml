name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: gofmt -l .
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build -trimpath -o brainx ./cmd/brainx

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: race
        run: go test -race ./...
