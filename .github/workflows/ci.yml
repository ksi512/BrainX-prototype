name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: gofmt -l .
      - name: vet
        run: go vet ./...
      - name: test
        shell: bash
        run: |
          set -o pipefail
          for pkg in $(go list ./...); do
            echo "== testing $pkg =="
            if ! go test -v "$pkg" 2>&1 | tee /tmp/bx-test.log; then
              grep -A14 'FAIL:' /tmp/bx-test.log | head -120 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            fi
          done
      - name: build
        run: go build -trimpath -o brainx ./cmd/brainx

  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: race
        run: go test -race ./...
